<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Actualiza la página · PagoControl</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:#102a43; background:#f6f9fc; font-family:Inter,system-ui,sans-serif; }
    main { width:min(100%,480px); padding:34px; text-align:center; background:#fff; border:1px solid #d9e2ec; border-radius:20px; box-shadow:0 18px 46px rgba(34,67,100,.12); }
    .mark { display:grid; place-items:center; width:42px; height:42px; margin:0 auto 18px; color:#0758a5; background:#e7f3ff; border-radius:12px; font-weight:800; }
    h1 { margin:0; font-size:1.35rem; letter-spacing:-.03em; }
    p { margin:12px 0 24px; color:#526f8f; font-size:.92rem; line-height:1.55; }
    a { display:inline-block; padding:11px 16px; color:#fff; background:#0b70d1; border-radius:9px; font-size:.88rem; font-weight:700; text-decoration:none; }
    a:hover { background:#0758a5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">PC</div>
    <h1>La página se actualizó</h1>
    <p>Tu formulario anterior ya no es válido. Recarga la página e inténtalo nuevamente.</p>
    <a href="{% url 'login' %}">Volver a iniciar sesión</a>
  </main>
</body>
</html>
