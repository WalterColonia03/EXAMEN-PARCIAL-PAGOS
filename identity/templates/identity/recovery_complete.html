<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acceso recuperado · PagoControl</title>
  <style>
    :root { color-scheme:light; font-family:Inter,system-ui,sans-serif; color:#102a43; background:#f6f9fc; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 15% 10%,#e7f3ff 0,transparent 34%),#f6f9fc; }
    main { width:min(100%,560px); padding:38px; background:#fff; border:1px solid #d9e2ec; border-radius:20px; box-shadow:0 20px 50px rgba(34,67,100,.12); }
    .check { display:grid; place-items:center; width:48px; height:48px; margin-bottom:20px; color:#166534; background:#dcfce7; border-radius:50%; font-size:1.4rem; font-weight:800; }
    h1 { margin:0; font-size:1.7rem; letter-spacing:-.035em; }
    p { color:#64748b; line-height:1.65; }
    .email { padding:12px 14px; color:#102a43; background:#f6f9fc; border:1px solid #d9e2ec; border-radius:9px; font-weight:700; overflow-wrap:anywhere; }
    a { display:flex; align-items:center; justify-content:center; min-height:46px; margin-top:22px; color:#fff; background:#0b70d1; border-radius:9px; font-weight:750; text-decoration:none; }
    a:hover { background:#0758a5; }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Tu acceso fue recuperado</h1>
    <p>La contraseña anterior dejó de funcionar y se cerraron las sesiones que seguían abiertas. Este es el correo de tu cuenta:</p>
    <p class="email">{{ recovered_email }}</p>
    <a href="{% url 'login' %}">Ingresar con la nueva contraseña</a>
  </main>
</body>
</html>
