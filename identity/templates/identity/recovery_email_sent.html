<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Revisa tu correo · PagoControl</title>
  <style>
    :root { color-scheme:light; font-family:Inter,system-ui,sans-serif; color:#102a43; background:#f6f9fc; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 15% 10%,#e7f3ff 0,transparent 34%),#f6f9fc; }
    main { width:min(100%,560px); padding:38px; background:#fff; border:1px solid #d9e2ec; border-radius:20px; box-shadow:0 20px 50px rgba(34,67,100,.12); }
    .check { display:grid; place-items:center; width:48px; height:48px; margin-bottom:20px; color:#0758a5; background:#e7f3ff; border-radius:50%; font-size:1.4rem; font-weight:800; }
    h1 { margin:0; font-size:1.7rem; letter-spacing:-.035em; }
    p { color:#64748b; line-height:1.65; }
    a { display:flex; align-items:center; justify-content:center; min-height:46px; margin-top:22px; color:#fff; background:#0b70d1; border-radius:9px; font-weight:750; text-decoration:none; }
    a:hover { background:#0758a5; }
    .secondary { color:#0758a5; background:transparent; border:1px solid #d9e2ec; }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✉</div>
    <h1>Revisa tu correo</h1>
    <p>Si la dirección corresponde a una cuenta activa, recibirás un código de 8 dígitos. Revisa también correo no deseado. Por seguridad, esta pantalla no confirma si una cuenta existe.</p>
    <a href="{% url 'access-recovery' %}">Ingresar mi código</a>
    <a class="secondary" href="{% url 'login' %}">Volver a iniciar sesión</a>
  </main>
</body>
</html>
